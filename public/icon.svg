<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="enfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f766e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#enfGradient)" />

  <!-- Central Emblem: Nursing / Healthcare Caduceus & Evolution Pulse -->
  <g filter="url(#subtleShadow)">
    <!-- Rounded Cross / Medical Caduceus Base -->
    <rect x="220" y="116" width="72" height="280" rx="36" fill="#ffffff" />
    <rect x="116" y="220" width="280" height="72" rx="36" fill="#ffffff" />

    <!-- Pulse / Evolution Wave Accent -->
    <path d="M152 256 L204 256 L232 192 L280 320 L308 256 L360 256" 
          stroke="url(#accentGradient)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- Circular Glow Indicator -->
  <circle cx="256" cy="152" r="16" fill="#2dd4bf" />
</svg>
